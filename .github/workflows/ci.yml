name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Core logic tests need no webcam, GUI or MediaPipe model
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check tests modules/drowsiness modules/clickbait/title_analyzer.py modules/clickbait/content_filter.py
      - name: Test
        run: pytest -v
